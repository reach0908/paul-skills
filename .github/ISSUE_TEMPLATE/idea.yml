name: Idea or feedback
description: A concrete user task, new skill, migration, or observed failure.
body:
  - type: markdown
    attributes:
      value: |
        This repo is curated. An idea stays open only if it clears **both** parts of the bar in [`SCOPE.md`](https://github.com/reach0908/paul-skills/blob/main/SCOPE.md):

        1. **Concrete need**: describe a real user task or an observed failure, including the result you want.
        2. **Fits the scope**: it supports this fork's skill-first, human-in-the-loop scope. Historical `.out-of-scope/` decisions are context; the explicit fork scope takes precedence.

        New skills need a concrete use case, source metadata, and observable evaluation criteria. `misc/` skills are frozen.
  - type: checkboxes
    id: read-scope
    attributes:
      label: Before filing
      options:
        - label: I've read this fork's `SCOPE.md` and considered the historical decisions in `.out-of-scope/`.
          required: true
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Which skill this changes, or the proposed new skill.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: User task or observed failure
      description: Describe the concrete task and expected outcome, or a real failure with the request, result, host, and model.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: What you'd change in the skill, as concretely as you can.
    validations:
      required: true
