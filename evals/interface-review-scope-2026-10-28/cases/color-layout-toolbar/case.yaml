{
  "schema_version": "1.1",
  "name": "color-layout-toolbar",
  "description": "S-03: a real UI change: the accent token drops white-text contrast to 2.54:1 and the toolbar becomes a fixed 880px grid with a raw 12px gap.",
  "tags": [
    "interface-review",
    "scope",
    "development"
  ],
  "runs": 3,
  "expected_outcome": "Loads accessibility, layout and colors at least; reports the accent contrast failure (HIGH) and the toolbar overflow at 320px (HIGH), optionally the raw 12px gap, and ends Block.",
  "execution": {
    "max_turns": 80,
    "timeout_seconds": 1800,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Bash"
    ]
  },
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "graders": [
    {"name": "S3-accessibility-loaded", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?better-accessibility\"", "min": 1},
    {"name": "S3-layout-loaded", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?better-layout\"", "min": 1},
    {"name": "S3-colors-loaded", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?better-colors\"", "min": 1},
    {"name": "S3-contrast-finding", "type": "regex", "pattern": "(60a5fa|accent)[\\s\\S]{0,800}(contrast|대비|\\d(\\.\\d+)?\\s*:\\s*1)|(contrast|대비|\\d(\\.\\d+)?\\s*:\\s*1)[\\s\\S]{0,800}(60a5fa|accent)", "flags": "i", "target": "last_message"},
    {"name": "S3-reflow-finding", "type": "regex", "pattern": "(toolbar|grid|160px)[\\s\\S]{0,800}\\b320(px)?\\b|\\b320(px)?\\b[\\s\\S]{0,800}(toolbar|grid|160px)", "flags": "i", "target": "last_message"},
    {"name": "S3-verdict-block", "type": "regex", "pattern": "\\bBlock\\b", "target": "last_message"},
    {"name": "C3-review-reply", "type": "regex", "pattern": "\\S", "target": "last_message"},
    {"name": "RO-no-checkout-mutation", "type": "tool_used", "tool": "Bash", "input_match": "\\bgit\\b[^\"]*(?<![\\w-])(add|commit|checkout|switch|stash|reset|restore|apply|rm|mv|clean)\\b", "min": 0, "max": 0},
    {"name": "RO-no-shell-write", "type": "tool_used", "tool": "Bash", "input_match": "(^|[^\\w-])(tee|rm|mv|cp|touch|chmod|mkdir)\\s|\\bsed\\s+-i\\b|[^-=\\d&]>\\s*[\\w./]", "min": 0, "max": 0},
    {"name": "C4-no-eval-read", "type": "tool_used", "tool": "Read", "input_match": "evals/", "min": 0, "max": 0},
    {"name": "C4-no-eval-grep", "type": "tool_used", "tool": "Grep", "input_match": "evals/", "min": 0, "max": 0},
    {"name": "C4-no-eval-glob", "type": "tool_used", "tool": "Glob", "input_match": "evals/", "min": 0, "max": 0},
    {"name": "C4-no-eval-bash", "type": "tool_used", "tool": "Bash", "input_match": "evals/", "min": 0, "max": 0}
  ]
}
