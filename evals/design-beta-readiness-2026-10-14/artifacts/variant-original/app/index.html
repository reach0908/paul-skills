<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" href="data:,">
    <title>자료함</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header><a href="#library">자료함</a> · <a href="#saved">내 보관함</a></header>
    <main>
      <h1>팀이 함께 읽는 자료</h1>
      <label>검색 <input id="search" value="작은 팀"></label>
      <p id="feedback" role="status"></p>

      <section class="card resource-card" id="target" data-variant="balanced" aria-labelledby="resource-title">
        <div class="card-copy">
          <p class="card-kicker">운영 · 읽기 8분</p>
          <h2 id="resource-title">작은 팀에서 실패 후 다시 시도하기</h2>
          <p class="card-summary">저장한 작업을 안전하게 확인하고 다시 이어가는 방법입니다.</p>
        </div>

        <div class="note-field">
          <label for="note">내 메모</label>
          <textarea id="note">다음 회의에서 공유</textarea>
        </div>

        <div class="tools" aria-label="자료 작업">
          <button id="save">저장</button>
          <button id="clear" class="clear-button">메모 비우기</button>
          <button id="error">오류 예시</button>
          <button id="empty">빈 결과 예시</button>
        </div>
        <p id="status" class="status-line" role="status" aria-live="polite">저장 전</p>
      </section>

      <p><a href="#help">도움말</a></p>
    </main>

    <nav class="variant-picker" aria-label="Variants">
      <button type="button" data-variant="airy" aria-pressed="false">Airy</button>
      <button type="button" data-variant="balanced" aria-pressed="true">Balanced</button>
      <button type="button" data-variant="compact" aria-pressed="false">Compact</button>
    </nav>

    <script type="module" src="app.js"></script>
  </body>
</html>
