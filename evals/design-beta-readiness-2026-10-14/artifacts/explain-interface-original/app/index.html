<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>겹친 빛</title><link rel="stylesheet" href="style.css"><style>.frame{position:relative;isolation:isolate;overflow:hidden;min-height:300px;background:#14243a;color:white;padding:32px}.glow{position:absolute;inset:-30px;background:radial-gradient(circle at 35% 45%,#dd4cd888,transparent 65%);filter:blur(24px);z-index:-2}.glass{position:absolute;inset:0;background:#ffffff0a;backdrop-filter:blur(8px);z-index:-1}.frame p{position:relative}#chip{display:inline-block;background:#163e70;padding:8px 16px;border-radius:8px}button{margin-top:16px}@media(prefers-reduced-motion:reduce){.glow{filter:blur(24px)}}</style><link rel="stylesheet" href="http://localhost:48914/shared.css"><main><nav><a href="detail.html">자료 상세</a><button id="theme">테마 바꾸기</button></nav><div class="site-grid"><h1>자료 저장 피드백의 빛 효과</h1><section class="frame"><div class="glow"></div><div class="glass"></div><p><span id="chip">자료 저장 완료</span></p><button id="replay">재생</button></section></div></main><script>document.querySelector('#theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'};document.querySelector('#replay').onclick=()=>{const el=document.querySelector('#chip');el.getAnimations().forEach(a=>a.cancel());if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.style.opacity='1';el.style.transform='none';return;}el.animate([{opacity:0,transform:'translateY(12px)'},{opacity:.9,transform:'translateY(1px)',offset:.25},{opacity:1,transform:'translateY(0px)'}],{duration:1200,easing:'linear',fill:'both'});};</script></html>
