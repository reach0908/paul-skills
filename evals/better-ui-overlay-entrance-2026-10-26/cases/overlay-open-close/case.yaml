{
  "schema_version": "1.1",
  "name": "overlay-open-close",
  "description": "O-01 (T-01 of the transitions beta): a dropdown and a toast pop via the hidden attribute and a modal uses transition: all 400ms with a display flip; add open and close transitions.",
  "tags": ["better-ui", "overlay", "development", "task"],
  "expected_outcome": "Anchored dropdown grows from its trigger, toast enters from and exits toward its own edge, modal exit actually runs; named properties, reduced-motion gating with an opacity fallback, no new dependency.",
  "runs": 3,
  "execution": {
    "max_turns": 40,
    "timeout_seconds": 900,
    "allowed_tools": ["Read", "Glob", "Grep", "Skill", "Edit", "Write"]
  },
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "graders": [
    {"name": "T1-no-transition-all", "type": "regex", "pattern": "transition(-property)?\\s*:\\s*all\\b", "match": "not_contains", "target": {"source": "file", "path": "src/styles.css"}},
    {"name": "T2-reduced-motion-gate", "type": "regex", "pattern": "prefers-reduced-motion", "target": {"source": "file", "path": "src/styles.css"}},
    {"name": "T3-menu-origin", "type": "regex", "pattern": "transform-origin", "target": {"source": "file", "path": "src/styles.css"}},
    {"name": "T4-project-duration-tokens", "type": "regex", "pattern": "var\\(--duration-(short|medium)\\)", "target": {"source": "file", "path": "src/styles.css"}},
    {"name": "T5-no-new-dependency", "type": "regex", "pattern": "\"dependencies\"", "match": "not_contains", "target": {"source": "file", "path": "package.json"}},
    {"name": "IND-better-ui-loaded", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?better-ui\"", "min": 1},
    {"name": "IND-enter-exit-read", "type": "tool_used", "tool": "Read", "input_match": "better-ui/enter-exit\\.md", "min": 1},
    {"name": "C4-no-eval-read", "type": "tool_used", "tool": "Read", "input_match": "evals/", "min": 0, "max": 0},
    {"name": "C4-no-eval-grep", "type": "tool_used", "tool": "Grep", "input_match": "evals/", "min": 0, "max": 0},
    {"name": "C4-no-eval-glob", "type": "tool_used", "tool": "Glob", "input_match": "evals/", "min": 0, "max": 0}
  ]
}
