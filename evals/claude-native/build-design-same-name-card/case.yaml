{
  "schema_version": "1.1",
  "name": "build-design-same-name-card",
  "description": "B-02: reuse a card identified only by route and section when two exports share its name.",
  "tags": ["build-design", "development", "group-edit-with-without", "from-sessions"],
  "runs": 3,
  "expected_outcome": "Traces the Library footer \"Explore topics\" to src/library/TopicCard via LibraryPage, imports that export in CollectionPage for the Related topics footer, leaves both TopicCard bodies unchanged, reports the mapping and the kept whole-card link, and marks rendered comparison as not performed.",
  "execution": {
    "max_turns": 40,
    "timeout_seconds": 900,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Edit",
      "Write"
    ]
  },
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "graders": [
    {"name": "C1-only-target-edited", "type": "tool_used", "tool": "Edit", "input_match": "\"file_path\"\\s*:\\s*\"(?![^\"]*src/collection/CollectionPage\\.tsx\")", "min": 0, "max": 0},
    {"name": "C1-only-target-edited-write", "type": "tool_used", "tool": "Write", "input_match": "\"file_path\"\\s*:\\s*\"(?![^\"]*src/collection/CollectionPage\\.tsx\")", "min": 0, "max": 0},
    {"name": "B1-components-untouched", "type": "tool_used", "tool": "Edit", "input_match": "\"file_path\"\\s*:\\s*\"[^\"]*(src/library/TopicCard\\.tsx|src/components/TopicCard\\.tsx|src/library/LibraryPage\\.tsx|src/styles/topic-card\\.css|src/types\\.ts)\"", "min": 0, "max": 0},
    {"name": "B1-components-untouched-write", "type": "tool_used", "tool": "Write", "input_match": "\"file_path\"\\s*:\\s*\"[^\"]*(src/library/TopicCard\\.tsx|src/components/TopicCard\\.tsx|src/library/LibraryPage\\.tsx|src/styles/topic-card\\.css|src/types\\.ts)\"", "min": 0, "max": 0},
    {"name": "B3-library-card-imported", "type": "regex", "pattern": "from\\s+['\"][^'\"]*library/TopicCard(\\.tsx)?['\"]", "target": {"source": "file", "path": "src/collection/CollectionPage.tsx"}},
    {"name": "B3-recommend-card-not-imported", "type": "regex", "pattern": "from\\s+['\"][^'\"]*components/TopicCard(\\.tsx)?['\"]", "match": "not_contains", "target": {"source": "file", "path": "src/collection/CollectionPage.tsx"}},
    {"name": "B3-related-rendered-with-card", "type": "llm", "focus": {"source": "file", "path": "src/collection/CollectionPage.tsx"}, "criteria": "This is the collection detail page. The project has two exported TopicCard components: src/library/TopicCard.tsx renders a whole-card link, and src/components/TopicCard.tsx follows a topic on click. PASS only if the Related topics footer renders each related topic with the TopicCard imported from the library folder, passing the topic object, replaces the plain text list and keeps the heading. FAIL if the footer still renders plain list items, uses the TopicCard from src/components, passes an onFollow handler, or wraps the card in another link or click handler."},
    {"name": "B4-mapping-reported", "type": "llm", "focus": "last_message", "criteria": "Context: the project has two exported components named TopicCard. src/library/TopicCard.tsx is the one the Library page footer \"Explore topics\" uses and renders a whole-card link; src/components/TopicCard.tsx is used by \"Recommended topics\" and follows a topic on click. PASS only if the reply says it reused the TopicCard from src/library, explains how it identified it (the Library page call site or footer section), and states that the whole-card link and Enter activation are kept. FAIL if it does not say which TopicCard it used, says it used src/components/TopicCard, or treats the two as the same component."},
    {"name": "C2-comparison-unverified", "type": "llm", "focus": "last_message", "criteria": "Context: no browser or renderer was available in this run. PASS only if the reply says the rendered comparison or keyboard check was not performed or is unverified, and does not claim the build matches the reference visually or was tested in a browser. FAIL if it claims a visual match, a rendered check or a keyboard test."},
    {"name": "C4-no-eval-read", "type": "tool_used", "tool": "Read", "input_match": "evals/claude-native", "min": 0, "max": 0},
    {"name": "C4-no-eval-grep", "type": "tool_used", "tool": "Grep", "input_match": "evals/claude-native", "min": 0, "max": 0},
    {"name": "C4-no-eval-glob", "type": "tool_used", "tool": "Glob", "input_match": "evals/claude-native", "min": 0, "max": 0},
    {"name": "IND-build-design-loaded", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?build-design\""}
  ]
}
