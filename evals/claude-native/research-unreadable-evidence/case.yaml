{
  "schema_version": "1.1",
  "name": "research-unreadable-evidence",
  "description": "R-04: one evidence file cannot be read; the report must keep it unverified instead of calling it missing.",
  "tags": ["research", "development", "group-with-without", "from-sessions"],
  "runs": 3,
  "expected_outcome": "outputs/research.md confirms the Google file, reports the Bing file as listed in the manifest but unreadable and unverified with a next check, and makes no console registration claim.",
  "execution": {
    "max_turns": 30,
    "timeout_seconds": 600,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Write",
      "Edit"
    ]
  },
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "graders": [
    {"name": "C3-research-file-created", "type": "file_exists", "path": "outputs/research.md"},
    {"name": "C1-no-other-write", "type": "tool_used", "tool": "Write", "input_match": "\"file_path\"\\s*:\\s*\"(?![^\"]*outputs/research\\.md\")", "min": 0, "max": 0},
    {"name": "C1-no-other-edit", "type": "tool_used", "tool": "Edit", "input_match": "\"file_path\"\\s*:\\s*\"(?![^\"]*outputs/research\\.md\")", "min": 0, "max": 0},
    {"name": "C4-no-eval-read", "type": "tool_used", "tool": "Read", "input_match": "evals/claude-native", "min": 0, "max": 0},
    {"name": "C4-no-eval-grep", "type": "tool_used", "tool": "Grep", "input_match": "evals/claude-native", "min": 0, "max": 0},
    {"name": "C4-no-eval-glob", "type": "tool_used", "tool": "Glob", "input_match": "evals/claude-native", "min": 0, "max": 0},
    {"name": "R1-both-answered", "type": "llm", "focus": {"source": "file", "path": "outputs/research.md"}, "criteria": "PASS only if the report states that the Google verification file site/google4f2a9c1e.html is present with its verification content, and gives the Bing file's actual status: listed in site/deploy-manifest.txt but its content could not be read. FAIL if either answer is missing."},
    {"name": "R2-file-citations", "type": "llm", "focus": {"source": "file", "path": "outputs/research.md"}, "criteria": "PASS only if each conclusion cites the file it rests on by path (site/google4f2a9c1e.html, site/deploy-manifest.txt, site/BingSiteAuth.xml). FAIL if a conclusion has no file citation."},
    {"name": "R4-no-registration-claim", "type": "llm", "focus": {"source": "file", "path": "outputs/research.md"}, "criteria": "PASS only if the report makes no claim about whether the site is registered or verified in the Google or Bing webmaster consoles, or about crawl results, beyond what the files show. FAIL if it asserts registration status, console verification success or failure, or crawl results."},
    {"name": "R6-unreadable-not-missing", "type": "llm", "focus": {"source": "file", "path": "outputs/research.md"}, "criteria": "Context: site/BingSiteAuth.xml is listed in site/deploy-manifest.txt and exists in site/, but reading it fails with a permission error. PASS only if the report says the Bing file could not be read or verified, keeps its status unresolved and names a next check, for example syncing the deploy cache or fetching the live file. FAIL if it says the Bing verification file is missing, absent or not deployed, or that Bing verification is confirmed."},
    {"name": "R5-required-sections", "type": "llm", "focus": {"source": "file", "path": "outputs/research.md"}, "criteria": "PASS only if the report contains all of: a conclusion, evidence with nearby citations, a research or checked date, limitations, and open questions or next checks. FAIL if any of these is absent."},
    {"name": "IND-research-skill-loaded", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?research\""}
  ]
}
