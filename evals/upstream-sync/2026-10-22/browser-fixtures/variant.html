<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upstream control fixture</title><link rel="icon" href="data:,"><style>body{margin:0;font:16px system-ui;background:#eee}main{max-width:960px;margin:auto}section{background:white;padding:16px}input{max-width:100%;box-sizing:border-box}button:focus-visible,input:focus-visible{outline:2px solid blue}body.controls-hidden nav,body.controls-hidden [class$="-select"]{display:none!important}</style><style>.variant-page {
  container: variant-page / inline-size;
  margin-inline: calc(50% - 50vw);
  padding: 24px;
}

.variant-layout {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 644px;
  margin-inline: auto;
}

.variant-picker {
  all: unset;
  display: none;
  flex-direction: column;
  gap: 16px;
  max-height: calc(100dvh - 48px);
  overflow-y: auto;
  scrollbar-width: none;
  padding: 6px;
  border-radius: 14px;
  background: rgb(20 20 20 / 0.92);
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.1);
  font: 13px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  user-select: none;
}

.variant-picker-group {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.variant-picker-heading {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 6px;
  font-size: 11px;
  font-weight: 500;
  color: rgb(255 255 255 / 0.45);
}

.variant-picker button {
  all: unset;
  flex: none;
  padding: 8px 10px;
  border-radius: 8px;
  font: inherit;
  color: rgb(255 255 255 / 0.6);
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: color 200ms ease-out, font-weight 200ms ease-out;
}

.variant-picker button:hover {
  color: rgb(255 255 255 / 0.85);
}

.variant-picker button[aria-pressed="true"] {
  background: rgb(255 255 255 / 0.14);
  color: rgb(255 255 255);
  font-weight: 500;
}

.variant-picker button:focus-visible {
  outline: 2px solid rgb(255 255 255 / 0.7);
  outline-offset: 2px;
}

.variant-picker-select {
  position: relative;
  align-self: flex-start;
  max-width: 100%;
  color: rgb(255 255 255);
}

.variant-picker-select select {
  all: unset;
  box-sizing: border-box;
  max-width: 100%;
  padding: 10px 36px 10px 16px;
  border-radius: 999px;
  background: rgb(20 20 20 / 0.92);
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.1);
  font: 500 13px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
}

.variant-picker-select select:focus-visible {
  outline: 2px solid rgb(255 255 255 / 0.7);
  outline-offset: 2px;
}

.variant-picker-select svg {
  position: absolute;
  top: 50%;
  right: 14px;
  translate: 0 -50%;
  pointer-events: none;
  color: rgb(255 255 255 / 0.6);
}

/* 208px list + 24px gap + 644px piece */
@container variant-page (min-width: 876px) {
  .variant-layout {
    display: grid;
    grid-template-columns: 208px 644px;
    justify-content: center;
    gap: 24px;
    align-items: start;
    max-width: none;
  }

  .variant-picker {
    display: flex;
    position: sticky;
    top: 24px;
  }

  .variant-picker-select {
    display: none;
  }
}</style><main><div class="variant-page">
  <div class="variant-layout">
    <nav class="variant-picker" aria-label="Variants"><div class="variant-picker-group" role="group" aria-labelledby="group-Density"><span class="variant-picker-heading" id="group-Density">Density</span><button type="button" data-variant="choice-0">Density 1: 상태와 접근 권한</button><button type="button" data-variant="choice-1">Density 2: 상태와 접근 권한</button><button type="button" data-variant="choice-2">Density 3: 상태와 접근 권한</button></div></nav>

    <div class="variant-picker-select">
      <select aria-label="Variant"><optgroup label="Density"><option value="choice-0">Density 1: 상태와 접근 권한</option><option value="choice-1">Density 2: 상태와 접근 권한</option><option value="choice-2">Density 3: 상태와 접근 권한</option></optgroup></select>
      <svg aria-hidden="true" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4" /></svg>
    </div>

    <div class="variant-stage">
      <section><h1>Demo component</h1><p id="active"></p><label>Working input <input id="draft" value="keep this text"></label><button id="save">Save draft</button><p id="feedback"></p></section>
    </div>
  </div>
</div></main><script>const config = {"prefix": "variant", "param": "__variant"};
const buttons = [...document.querySelectorAll(`[data-${config.prefix}]`)];
const select = document.querySelector('select');
const keys = buttons.map(b => b.dataset[config.prefix]);
function show(key, write=true) {
 if (!keys.includes(key)) key=keys[0];
 if (write) { const url=new URL(location);url.searchParams.set(config.param,key);history.replaceState({},'',url); }
 buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset[config.prefix]===key)));
 select.value=key;document.querySelector('#active').textContent=key;
 const active=buttons.find(b=>b.dataset[config.prefix]===key);
 const nav=document.querySelector('nav');
 if(getComputedStyle(nav).display!=='none')nav.scrollTop=active.offsetTop-nav.offsetTop-nav.clientHeight/2;
}
buttons.forEach(b=>b.addEventListener('click',()=>show(b.dataset[config.prefix])));
select.addEventListener('change',()=>show(select.value));
document.querySelector('#save').addEventListener('click',()=>document.querySelector('#feedback').textContent='Saved: '+document.querySelector('#draft').value);
document.addEventListener('keydown',e=>{
 if(e.defaultPrevented||e.metaKey||e.ctrlKey||e.altKey||e.shiftKey||e.target.closest('input,textarea,select,[contenteditable]'))return;
 if(e.key.toLowerCase()==='h'){e.preventDefault();document.body.classList.toggle('controls-hidden');return;}
 const delta={ArrowDown:1,ArrowRight:1,ArrowUp:-1,ArrowLeft:-1}[e.key];
 if(delta){e.preventDefault();show(keys[(keys.indexOf(select.value)+delta+keys.length)%keys.length]);}
});
show(new URL(location).searchParams.get(config.param));
</script>
