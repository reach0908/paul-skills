<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldnotes · local comparison</title>
<!-- THROWAWAY UI PROTOTYPE. Question: which mobile grouping and order explains saving sources, keeping notes with sources and recovering why an item was saved? Baseline: baseline-original.html copied from supplied index.html. Fixed: wordmark, cream/green palette, three capabilities, Start reading -> #start, useful offline status. A: unchanged product markup/copy. B: ordered reading workflow. C: return context first, grouped source and note. No winner or product approval. -->
<style>
*{box-sizing:border-box}body{font:18px system-ui;background:#faf7ef;color:#20251e;margin:0}a{color:inherit}a:focus-visible,button:focus-visible{outline:3px solid #3b5c42;outline-offset:4px}button{font:inherit}header,main,footer{padding:24px;max-width:64rem;margin:auto}.wordmark{color:#3b5c42}body.local-prototype{padding-bottom:150px}.alternative header,.alternative main,.alternative footer{max-width:560px}.alternative h1{font-size:clamp(2rem,9vw,2.7rem);line-height:1.12;letter-spacing:-.045em;margin:12px 0 20px}.alternative h2{font-size:1.25rem;line-height:1.35;margin:0 0 8px}.alternative p{line-height:1.55;margin:0 0 18px}.alternative header{padding-bottom:0}.alternative .intro{color:#4c554b}.cta{display:inline-flex;justify-content:center;align-items:center;min-height:48px;background:#3b5c42;color:#fff;border-radius:6px;padding:12px 22px;text-decoration:none;font-weight:650}.flow{list-style:none;padding:0;margin:32px 0}.flow li{display:grid;grid-template-columns:32px 1fr;gap:16px;padding:20px 0;border-top:1px solid #c5cdbe}.number{font-size:14px;background:#e6ebdf;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:#3b5c42}.flow p{margin:0}.offline{font-size:14px;line-height:1.5;border-top:1px solid #c5cdbe;padding-top:18px;margin-top:28px!important;color:#4c554b}.kicker{font-size:12px;font-weight:650;color:#3b5c42;letter-spacing:.1em;text-transform:uppercase}.outcome{border-left:4px solid #3b5c42;padding-left:20px;margin:32px 0}.foundation{background:#e9eddf;padding:24px;margin:28px -8px;border-radius:10px}.foundation section+section{border-top:1px solid #c4ccb9;padding-top:20px;margin-top:20px}.foundation p:last-child{margin-bottom:0}.alternative footer{font-size:14px;color:#4c554b}.prototype-tools{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 24px));background:#202b22;color:#fff;z-index:2;border-radius:12px;box-shadow:0 4px 20px #0003;padding:10px 12px;font:12px/1.4 system-ui}.prototype-tools p{margin:0 0 6px;color:#e0e9d7}.controls{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px}.controls button{min-height:44px;border:1px solid #758570;border-radius:6px;color:#fff;background:transparent;cursor:pointer;font-size:22px}.controls button:focus-visible{outline-color:#dcebc8}.controls output{text-align:center;font-size:14px}.prototype-tools small{display:block;margin-top:6px;color:#e0e9d7}footer{scroll-margin-bottom:160px}[hidden]{display:none!important}
</style></head><body><div id="page"></div>
<aside class="prototype-tools" id="tools" aria-label="Prototype comparison" hidden><p>비교용 시안 · 제품안 미확정</p><div class="controls"><button id="previous" aria-label="Previous variant">←</button><output id="label" aria-live="polite"></output><button id="next" aria-label="Next variant">→</button></div><small id="state"></small></aside>
<template id="variant-A"><header><b class="wordmark">Fieldnotes</b></header><main><h1>Keep useful reading close</h1><p>Save sources, follow notes, return with context.</p><a href="#start">Start reading</a><section><h2>Keep a source</h2><p>Save links in one place.</p></section><section><h2>Follow a thread</h2><p>Keep notes with the sources.</p></section><section><h2>Return with context</h2><p>See why you saved it.</p></section><p role="status">Sync paused while offline. Your saved items remain on this device.</p></main><footer id="start">Demo start</footer></template>
<template id="variant-B"><div class="alternative"><header><b class="wordmark">Fieldnotes</b></header><main><h1>Keep useful reading close</h1><p class="intro">Save a source, add a note, and pick up where your thinking left off.</p><ol class="flow"><li><span class="number" aria-hidden="true">1</span><section><h2>Save the source</h2><p>Keep links to useful reading in one place.</p></section></li><li><span class="number" aria-hidden="true">2</span><section><h2>Keep your notes beside it</h2><p>Add your thoughts alongside the source they came from.</p></section></li><li><span class="number" aria-hidden="true">3</span><section><h2>Remember why you saved it</h2><p>Return to the source with your original context.</p></section></li></ol><a class="cta" href="#start">Start reading</a><p class="offline" role="status">Sync is paused while you're offline. Your saved items are still on this device.</p></main><footer id="start">Demo start</footer></div></template>
<template id="variant-C"><div class="alternative"><header><b class="wordmark">Fieldnotes</b></header><main><p class="kicker">Return with context</p><h1>Remember what made it worth saving</h1><div class="outcome"><p>Come back to useful reading and see why you kept it.</p><a class="cta" href="#start">Start reading</a></div><div class="foundation"><section><h2>A place for the source</h2><p>Keep links to useful reading together.</p></section><section><h2>Your notes, right beside it</h2><p>Keep your thoughts with the source they came from.</p></section></div><p class="offline" role="status">Sync is paused while you're offline. Your saved items are still on this device.</p></main><footer id="start">Demo start</footer></div></template>
<script>
const variants=['A','B','C'];
const names={A:'기존안',B:'읽기 흐름 순서',C:'다시 찾는 이유 우선'};
const states={A:'순서: 소개 → CTA → 출처 → 메모 → 맥락',B:'순서: 소개 → 출처 → 메모 → 맥락 → CTA',C:'순서: 맥락 → CTA → 출처와 메모 묶음'};
const local=['localhost','127.0.0.1','[::1]',''].includes(location.hostname);
let current='A';
function render(){const key=new URL(location.href).searchParams.get('variant');current=local&&variants.includes(key)?key:'A';document.querySelector('#page').replaceChildren(document.querySelector('#variant-'+current).content.cloneNode(true));document.querySelector('#label').textContent=current+' / 3 · '+names[current];document.querySelector('#state').textContent=states[current]+' · offline · CTA: #start';document.documentElement.dataset.variant=current;}
function cycle(direction){const url=new URL(location.href);url.searchParams.set('variant',variants[(variants.indexOf(current)+direction+3)%3]);url.hash='';history.replaceState(null,'',url);render();window.scrollTo(0,0);}
if(local){document.body.classList.add('local-prototype');document.querySelector('#tools').hidden=false;document.querySelector('#previous').addEventListener('click',()=>cycle(-1));document.querySelector('#next').addEventListener('click',()=>cycle(1));document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable]')||event.altKey||event.ctrlKey||event.metaKey)return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();cycle(event.key==='ArrowLeft'?-1:1);}});}
window.addEventListener('popstate',render);render();
</script></body></html>
