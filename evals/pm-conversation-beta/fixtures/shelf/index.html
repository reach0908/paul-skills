<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>작은 책장</title><style>body{font:17px system-ui;max-width:430px;margin:0 auto;padding:24px;background:#faf8f2;color:#242824}button,input{font:inherit;padding:12px;margin:5px;border:1px solid #aab2a4;border-radius:9px;background:white}nav{display:flex}article{padding:16px;margin:14px 0;border:1px solid #c9cec3;border-radius:12px}small{display:block;color:#545c52}button[aria-current=true]{background:#314b38;color:white}#notice{min-height:28px}input{box-sizing:border-box;width:95%}</style><h1>작은 책장</h1><p>읽고 싶은 책을 담고 다시 찾아보세요.</p><small>가상 도서 프로토타입입니다. 외부 전송은 없으며 새로고침하면 초기 상태가 됩니다.</small><nav aria-label="책장 탐색"><button id="home">추천</button><button id="library">내 보관함</button></nav><p id="notice" role="status"></p><main id="app"></main><script>
const books=[{id:1,title:'별의 지도',author:'가상 저자 A',tag:'우주'},{id:2,title:'숲에서 읽는 편지',author:'가상 저자 B',tag:'에세이'},{id:3,title:'밤의 관측소',author:'가상 저자 C',tag:'우주'}];let saved=new Set(),tab='추천',query='';const app=document.getElementById('app');
function list(){document.querySelector('#home').setAttribute('aria-current',tab==='추천');document.querySelector('#library').setAttribute('aria-current',tab==='내 보관함');app.innerHTML='<h2>'+tab+'</h2><label>책 찾기<input id="search" placeholder="제목으로 찾기" value="'+query+'"></label><div id="cards"></div>';document.querySelector('#search').oninput=e=>{query=e.target.value;cards()};cards()}
function cards(){const found=books.filter(b=>(tab==='추천'||saved.has(b.id))&&b.title.includes(query));document.querySelector('#cards').innerHTML=found.map(b=>'<article><h3>'+b.title+'</h3><p>'+b.author+' · '+b.tag+'</p><button onclick="detail('+b.id+')">'+b.title+' 살펴보기</button><button onclick="save('+b.id+')">'+(saved.has(b.id)?'담았어요':'담기')+'</button></article>').join('')||'<p>해당하는 책이 없습니다.</p>'}
function save(id){saved.add(id);document.querySelector('#notice').textContent='내 보관함에 담았어요';cards()}
function detail(id){let b=books.find(x=>x.id===id);app.innerHTML='<button id="back">목록으로</button><h2>'+b.title+'</h2><p>'+b.author+'</p><p>소개: '+b.tag+'에 관한 가상 도서입니다.</p><p>'+(saved.has(id)?'내 보관함에 담은 책입니다.':'아직 담지 않은 책입니다.')+'</p>';document.querySelector('#back').onclick=()=>{tab='추천';query='';list()}}
document.querySelector('#home').onclick=()=>{tab='추천';query='';list()};document.querySelector('#library').onclick=()=>{tab='내 보관함';query='';list()};list();
</script></html>
