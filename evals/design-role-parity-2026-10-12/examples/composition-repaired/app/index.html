<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>씨앗 수령 · 로컬 와이어프레임</title><link rel="stylesheet" href="tokens.css">
<style>
a{color:var(--ink)}header{border-bottom:1px solid var(--line)}nav,.actions{display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:center}nav a{padding:var(--space-2)}nav a[aria-current=page]{font-weight:bold;text-decoration-thickness:3px}.demo{color:var(--muted);margin:var(--space-2) 0}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-6);margin-block:var(--space-4)}h1,h2,p{margin-top:0}h2{font-size:20px}dl{display:grid;grid-template-columns:100px 1fr;gap:var(--space-2);margin:0}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}label{display:block;font-weight:bold;margin-bottom:var(--space-2)}input{width:100%;max-width:420px}button{cursor:pointer;background:var(--surface);color:var(--ink)}button.primary{background:var(--ink);color:var(--surface)}button:disabled{cursor:wait;opacity:.65}.feedback{border-left:var(--space-1) solid var(--ink);padding:var(--space-3);margin-block:var(--space-4)}.error{font-weight:bold}.meta{color:var(--muted)}.actions{margin-top:var(--space-4)}.skip{position:absolute;left:-9999px}.skip:focus{left:var(--space-4);top:var(--space-2);background:var(--surface);padding:var(--space-2);z-index:2}main:focus,h1:focus{outline:0}article p{max-width:60ch}@media(max-width:520px){header,main{padding:var(--space-3)}.panel{padding:var(--space-4)}h1{font-size:var(--space-6)}nav{gap:var(--space-2)}nav a{padding:var(--space-2) var(--space-1)}nav button{margin-left:auto}dl{grid-template-columns:74px 1fr}.demo{font-size:14px}.actions>*{min-height:44px}input,select{min-height:44px}}
</style></head><body>
<a class="skip" href="#main">본문으로 이동</a>
<header><nav aria-label="전역 탐색"><a href="#/seeds">Seeds</a><a href="#/my-pickups">My pickups</a><button type="button" id="reset">Reset demo</button></nav><p class="demo">로컬 시뮬레이션 · 실제 예약, 계정, 전송, 저장, 재고 확보가 없습니다. 새로고침하면 초기화됩니다.</p></header>
<main id="main" tabindex="-1"></main>
<script>
const seeds={'BEAN-2':{id:'BEAN-2',name:'가을 강낭콩',season:'autumn',description:'작은 화분에서도 기를 수 있는 키 작은 강낭콩 품종입니다.'},'SUN-5':{id:'SUN-5',name:'해바라기',season:'summer',description:'햇볕이 잘 드는 넓은 자리에서 자랍니다.'}};
let season='autumn',draft='',failed=false,record=null,state='S-SEEDS',attempt=0,timer=null;
const main=document.querySelector('main');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const route=()=>location.hash.startsWith('#/')?location.hash.slice(1):'/seeds';
const seed=()=>seeds[route().split('/')[2]];
const pickup=()=>'<dl><dt>수령 시간</dt><dd>토요일 10:00~12:00</dd><dt>수령 장소</dt><dd>North community garden desk</dd></dl>';
const receipt=()=>`<section class="panel" aria-label="수령 내역"><h2>SP-21 · 모의 예약 확정</h2><dl><dt>참조번호</dt><dd>SP-21</dd><dt>신청 이름</dt><dd>${esc(record.name)}</dd><dt>씨앗</dt><dd>${esc(record.seed.name)} · ${record.seed.id} · 한 봉지</dd></dl><hr>${pickup()}</section>`;
function cancel(){attempt++;clearTimeout(timer);timer=null;}
function nav(path){cancel();if(route()===path){enter();}else location.hash=path;}
function enter(){cancel();const p=route();state=p==='/my-pickups'?(record?'S-PICKUPS-FILLED':'S-PICKUPS-EMPTY'):seed()?(record?'S-DETAIL-RECORDED':'S-EDIT'):'S-SEEDS';render();}
function render(focus=true){
const s=seed();document.querySelectorAll('nav a').forEach(a=>{if(a.getAttribute('href')==='#'+(route()==='/my-pickups'?'/my-pickups':'/seeds'))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
if(state==='S-SEEDS')main.innerHTML=`<h1 tabindex="-1">Seeds</h1><p>토요일에 받을 씨앗 한 봉지를 골라 주세요.</p><label for="season">계절</label><select id="season"><option value="autumn" ${season==='autumn'?'selected':''}>가을 · autumn</option><option value="summer" ${season==='summer'?'selected':''}>여름 · summer</option></select>${Object.values(seeds).filter(x=>x.season===season).map(x=>`<article class="panel"><p class="meta">${x.id} · 한 봉지</p><h2><a href="#/seeds/${x.id}">${x.name}</a></h2><p>${x.description}</p><p class="meta">상세에서 수령 시간과 장소를 확인하세요.</p></article>`).join('')}`;
else if(state.startsWith('S-PICKUPS'))main.innerHTML=`<h1 tabindex="-1">My pickups</h1>${record?receipt():'<section class="panel"><h2>아직 확정된 수령 내역이 없습니다.</h2><p>확정된 모의 예약만 여기에 표시됩니다.</p></section>'}<div class="actions"><a href="#/seeds">Seeds로 이동</a></div>`;
else if(s){let pending=state.startsWith('S-PENDING');main.innerHTML=`<h1 tabindex="-1">${s.name}</h1><p class="meta">${s.id} · ${s.season} · 한 봉지</p><p>${s.description}</p>${state==='S-CONFIRMED'?receipt():`<section class="panel" aria-label="수령 안내"><h2>토요일 수령 안내</h2>${pickup()}</section>`}${state==='S-CONFIRMED'?'<p role="status">시뮬레이션이 완료되었습니다. 실제 예약이 아닙니다.</p><div class="actions"><a href="#/my-pickups">My pickups에서 다시 확인</a><button id="back">Back</button></div>':state==='S-DETAIL-RECORDED'?'<p class="feedback">이미 모의 예약 한 건이 있습니다. 현재 상세의 씨앗과 기존 예약은 다를 수 있습니다. 새 시연은 Reset demo로 시작하세요.</p><div class="actions"><a href="#/my-pickups">기존 My pickups 보기</a><button id="back">Back</button></div>':`<form novalidate><label for="name">신청 이름 (필수)</label><input id="name" name="name" autocomplete="name" value="${esc(draft)}" ${pending||state==='S-FAILED'?'readonly':''} ${state==='S-INVALID'?'aria-invalid="true" aria-describedby="feedback"':''}><div id="feedback" class="feedback" ${state==='S-INVALID'||state==='S-FAILED'?'role="alert"':'role="status"'}>${state==='S-INVALID'?'이름을 입력해 주세요. 씨앗과 입력 내용은 유지됩니다.':pending?'모의 처리 중입니다 (400ms). 아직 확정되지 않았습니다.':state==='S-FAILED'?'첫 모의 요청이 실패했습니다. 예약 내역은 없습니다. 같은 내용으로 Retry하거나 Back으로 수정하세요.':'첫 요청은 모의 실패합니다. Retry하면 모의 예약이 확정됩니다.'}</div><div class="actions"><button class="primary" type="submit" ${pending?'disabled':''}>${state==='S-FAILED'?'Retry':pending?'처리 중':'Submit'}</button><button id="back" type="button">Back</button></div></form>`}`;}
main.dataset.state=state;
document.title=(main.querySelector('h1')?.textContent||'씨앗 수령')+' · 씨앗 수령';
const select=document.querySelector('#season');if(select)select.onchange=e=>{season=e.target.value;render(false);document.querySelector('#season').focus();};
const input=document.querySelector('#name');if(input)input.oninput=e=>{draft=e.target.value;if(state==='S-INVALID'&&draft.trim()){state='S-EDIT';input.removeAttribute('aria-invalid');input.removeAttribute('aria-describedby');document.querySelector('#feedback').textContent='첫 요청은 모의 실패합니다. Retry하면 모의 예약이 확정됩니다.';main.dataset.state=state;}};
const form=main.querySelector('form');if(form)form.onsubmit=e=>{e.preventDefault();submit();};
const back=document.querySelector('#back');if(back)back.onclick=()=>{if(['S-FAILED','S-INVALID','S-PENDING-FIRST','S-PENDING-RETRY'].includes(state)){cancel();state='S-EDIT';render();document.querySelector('#name').focus();}else nav('/seeds');};
if(focus){if(state==='S-INVALID')document.querySelector('#name').focus();else if(state==='S-FAILED')main.querySelector('[type=submit]').focus();else main.querySelector('h1').focus();}
}
function submit(){if(state.startsWith('S-PENDING')||record)return;if(!draft.trim()){state='S-INVALID';render();return;}const captured={name:draft.trim(),seed:seed()};const id=++attempt;state=failed?'S-PENDING-RETRY':'S-PENDING-FIRST';render();timer=setTimeout(()=>{if(id!==attempt)return;timer=null;if(!failed){failed=true;state='S-FAILED';}else{record=captured;state='S-CONFIRMED';}render();},400);}
document.querySelector('#reset').onclick=()=>{cancel();season='autumn';draft='';failed=false;record=null;nav('/seeds');};
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;if(a.getAttribute('href')==='#main'){e.preventDefault();main.focus({preventScroll:true});main.scrollIntoView({block:'start'});return;}if(a.hash.startsWith('#/')){e.preventDefault();nav(a.hash.slice(1));}});
window.addEventListener('hashchange',enter);enter();
</script></body></html>
