<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parcel progress</title><style>*{box-sizing:border-box}body{margin:0;font:17px/1.5 system-ui;background:#f8f8f8;color:#222}main{max-width:54rem;margin:2rem auto;padding:1rem}button{font:inherit;padding:.65rem}button:focus-visible,a:focus-visible{outline:3px solid #333;outline-offset:4px}.panel{border:1px solid #888;background:white;padding:1rem;margin:1rem 0}.bar{height:1rem;width:24%;background:#555;animation:travel 1.2s linear infinite}@keyframes travel{from{transform:translateX(0)}to{transform:translateX(250%)}}.track{overflow:hidden;border:1px solid #999}#details[hidden]{display:none}.scan-list{min-width:600px}.row{display:flex;justify-content:space-between;border-top:1px solid #ddd;padding:.6rem}#state{min-height:2rem}</style><main><h1>Parcel progress</h1><p>Parcel PX-42, North depot</p><button id="toggle" aria-expanded="false" aria-controls="details">Show scan details</button><section id="details" hidden class="panel"><h2>Scan history</h2><div class="scan-list"><div class="row"><span>Received at North depot</span><span>09:40</span></div><div class="row"><span>Sorted for local delivery</span><span>10:15</span></div></div></section><section class="panel"><h2>Refresh parcel status</h2><p id="state" role="status">Ready</p><div class="track" id="track" hidden><div class="bar"></div></div><button id="refresh">Refresh status</button> <button id="cancel" hidden>Cancel refresh</button></section><p><a href="#help" id="help-link">Help with a delivery</a></p><section id="help"><h2>Delivery help</h2><p>Local demo; your refresh sends no network request.</p></section></main><script>const toggle=document.querySelector('#toggle'),details=document.querySelector('#details'),state=document.querySelector('#state'),refresh=document.querySelector('#refresh'),cancel=document.querySelector('#cancel'),track=document.querySelector('#track');let timer=null;toggle.onclick=()=>{details.hidden=!details.hidden;toggle.setAttribute('aria-expanded',String(!details.hidden));toggle.textContent=details.hidden?'Show scan details':'Hide scan details';};function finish(message){clearTimeout(timer);state.textContent=message;track.hidden=true;refresh.disabled=false;cancel.hidden=true;}refresh.onclick=()=>{state.textContent='Refreshing parcel PX-42...';refresh.disabled=true;cancel.hidden=false;track.hidden=false;timer=setTimeout(()=>finish('Updated. Out for delivery.'),1200);};cancel.onclick=()=>finish('Refresh cancelled. Previous status retained.');</script></html>
