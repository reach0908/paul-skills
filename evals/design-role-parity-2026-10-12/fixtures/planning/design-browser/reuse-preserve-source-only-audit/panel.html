<!doctype html><html lang="en"><meta charset="utf-8"><title>Notification settings</title><style>button:focus-visible{outline:3px solid #222}.saving{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.3}}</style><h1>Notifications</h1><label><input type="checkbox" id="email" checked>Email updates</label><button id="save">Save settings</button><p id="result" role="status">No changes</p><script>document.querySelector('#save').onclick=()=>{const r=document.querySelector('#result');r.className='saving';r.textContent='Saving...';setTimeout(()=>{r.className='';r.textContent='Saved locally';},400);};</script></html>
