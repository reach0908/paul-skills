<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neighborhood pickups</title>
<style>body{font:16px system-ui;margin:0;color:#202020;background:#fafafa}header,main{max-width:58rem;margin:auto;padding:1rem}nav{display:flex;gap:1rem}button,select,input{font:inherit;padding:.55rem}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #555;outline-offset:3px}.card{border:1px solid #777;background:white;padding:1rem;margin:1rem 0}label{display:block;margin:.75rem 0}button{cursor:pointer}#status{min-height:1.5rem}[hidden]{display:none!important}@media(max-width:480px){header,main{padding:.8rem}nav{flex-wrap:wrap}}</style>
<header><h1>Neighborhood pickups</h1><nav aria-label="Main"><a href="#pickups">Pickups</a><a href="#help">Help</a></nav></header>
<main><section id="list"><h2>Pickups</h2><label>Area <select id="area"><option value="all">All areas</option><option value="north" selected>North</option></select></label><article class="card"><h3>Vegetable box</h3><p>Order P-18, North hall, Friday 17:30</p><button id="open">View pickup</button></article></section>
<section id="detail" hidden><h2>Vegetable box pickup</h2><p>Order P-18, North hall, Friday 17:30</p><p id="status" role="status">Ready to confirm collection</p><button id="collect">Confirm collected</button> <button id="back">Back to pickups</button></section>
<section id="help"><h2>Help</h2><p>Collection is confirmed only after you see a receipt number.</p></section></main>
<script>const list=document.querySelector('#list'),detail=document.querySelector('#detail'),status=document.querySelector('#status');document.querySelector('#open').onclick=()=>{list.hidden=true;detail.hidden=false;location.hash='pickup-P-18';};document.querySelector('#back').onclick=()=>{detail.hidden=true;list.hidden=false;location.hash='pickups';};document.querySelector('#collect').onclick=()=>{status.textContent='Collection confirmed. Receipt RC-18';document.querySelector('#collect').disabled=true;};</script></html>
