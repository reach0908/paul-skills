<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>팀 사용량</title><link rel="stylesheet" href="style.css"></head><body><header><nav aria-label="서비스"><strong>모아 팀</strong><a href="index.html">작업실</a><a href="#help">도움말</a></nav></header><main><h1>팀 사용량</h1><div class="split"><div class="stack"><div id="usage"></div><section class="panel"><h2>최근 전송</h2><ul><li>성수 팝업 제안서: 124 MB</li><li>10월 캠페인 원본: 3.8 GB</li><li>인터뷰 녹음 12건: 842 MB</li><li>제품 사진: 1.2 GB</li><li>시안 비교 영상: 640 MB</li><li>주간 보고서: 14 MB</li></ul></section></div><aside class="panel"><h2>알림 설정</h2><label for="threshold">알림 받을 사용률</label><input id="threshold" value="80%"><p>프로젝트가 많아지는 주를 미리 준비해요.</p></aside></div><p id="help" class="muted">모아 팀은 작은 팀을 위한 업무 기록 도구예요.</p></main><script type="module" src="app.js"></script></body></html>
